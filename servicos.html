<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
		<title>Cadastro de Serviços - Lava Jato</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- Header -->
		<header class="site-header">
			<div class="header-inner">
				<a href="index.html" class="brand-wrapper">
					<div class="brand-logo">🛠️</div>
					<div class="brand-title">
						<span>OUTRO SEGMENTO</span>
						<span class="brand-subtitle">SEU NEGÓCIO</span>
					</div>
				</a>
				<nav class="navbar">
					<a href="index.html">🏠 Início</a>
					<a href="agendamentos.html">📅 Agendamentos</a>
					<a href="pedidos.html">📋 Pedidos / O.S.</a>
					<a href="caixa.html">💰 Livro Caixa</a>
					<a href="estoque.html">📦 Estoque</a>
					<a href="fidelidade.html">🎁 Pós-Venda</a>
					<a href="equipe.html">👥 Equipe</a>
					<a href="clientes.html">👤 Clientes</a>
					<a href="servicos.html" class="active">🛠️ Serviços</a>
				</nav>
				<div class="header-actions">
					<a href="configuracoes.html" class="btn-settings-gear" title="Configurações e Banco de Dados" id="btnConfiguracoes">
						⚙️
					</a>
				</div>
			</div>
		</header>

		<!-- Main -->
		<main class="container">
			<div class="page-header">
				<h1 class="page-title">Cadastro de Serviços</h1>
				<p class="page-subtitle">Configure o catálogo de serviços, etapas e valores</p>
			</div>

			<!-- Formulário de Cadastro -->
			<div class="content-card">
				<div class="content-card-title">
					<span id="formServicoTitulo">Novo Serviço</span>
					<button type="button" id="btnCancelarEdicaoServico" class="btn btn-secondary btn-sm" style="display: none;">Cancelar</button>
				</div>
				<form id="servicoForm" class="form">
					<div class="form-group">
						<label for="servicoNome">Nome do Serviço *</label>
						<input
							type="text"
							id="servicoNome"
							required
							placeholder="Ex: Lavagem Completa + Cera" />
					</div>

					<div class="form-group">
						<label for="servicoPreco">Preço Base (R$) *</label>
						<input
							type="number"
							id="servicoPreco"
							step="0.01"
							min="0"
							required
							placeholder="Ex: 80.00" />
					</div>

					<div class="form-group full-width">
						<label for="servicoDescricao">Descrição / Detalhes</label>
						<textarea
							id="servicoDescricao"
							placeholder="Produtos utilizados, tempo estimado ou etapas incluídas"></textarea>
					</div>

					<div class="form-actions">
						<button type="submit" id="btnSalvarServico" class="btn">💾 Salvar Serviço</button>
					</div>
				</form>
			</div>

			<!-- Tabela de Serviços -->
			<div class="content-card">
				<div class="content-card-title">
					<span>Serviços Disponíveis</span>
				</div>
				<div class="table-responsive">
					<table id="servicosTable" class="tabela">
						<thead>
							<tr>
								<th>Nome</th>
								<th>Preço</th>
								<th>Descrição / Detalhes</th>
								<th style="text-align: center;">Ações</th>
							</tr>
						</thead>
						<tbody>
							<!-- Preenchido via JS -->
						</tbody>
					</table>
				</div>
			</div>
		</main>

		<script src="js/brand-service.js"></script>
		<script src="js/caixa-service.js"></script>
		<script src="js/servicos.js"></script>
	</body>
</html>
