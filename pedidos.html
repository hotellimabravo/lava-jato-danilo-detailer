<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
		<title>Pedidos / Ordens de Serviço - Lava Jato</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- Header -->
		<header class="site-header">
			<div class="header-inner">
				<a href="index.html" class="brand-wrapper">
					<div class="brand-logo">🚗</div>
					<div class="brand-title">
						<span>Lava Jato</span>
						<span class="brand-subtitle">Danilo Detailer</span>
					</div>
				</a>
				<nav class="navbar">
					<a href="index.html">🏠 Início</a>
					<a href="pedidos.html" class="active">📋 Pedidos / O.S.</a>
					<a href="clientes.html">👤 Clientes</a>
					<a href="servicos.html">🛠️ Serviços</a>
				</nav>
			</div>
		</header>

		<!-- Main -->
		<main class="container">
			<div class="page-header">
				<h1 class="page-title">Pedidos e Ordens de Serviço</h1>
				<p class="page-subtitle">Emita ordens de serviço, registre pagamentos e consulte atendimentos</p>
			</div>

			<!-- Formulário de Pedido -->
			<div class="content-card">
				<div class="content-card-title">
					<span>Nova Ordem de Serviço</span>
				</div>

				<form id="pedidoForm" class="form">
					<!-- Campo Cliente com Autocomplete -->
					<div class="form-group" style="position: relative;">
						<label for="pedidoCliente">Cliente *</label>
						<input
							type="text"
							id="pedidoCliente"
							required
							autocomplete="off"
							placeholder="Digite para buscar pelo nome..." />
						<div id="sugestoesClientes" class="sugestoes"></div>
					</div>

					<!-- Data do Pedido -->
					<div class="form-group">
						<label for="pedidoData">Data do Atendimento</label>
						<input type="date" id="pedidoData" />
					</div>

					<!-- Serviços Selecionáveis -->
					<div class="form-group full-width">
						<label for="pedidoServico">
							Serviços Inclusos * 
							<span style="font-weight: normal; color: var(--text-muted); font-size: 0.8rem;">
								(Segure Ctrl / toque para selecionar múltiplos)
							</span>
						</label>
						<select id="pedidoServico" multiple required>
							<!-- Preenchido via JS -->
						</select>
					</div>

					<!-- Valor Total -->
					<div class="form-group">
						<label for="pedidoValor">Valor Total (R$) *</label>
						<input
							type="number"
							id="pedidoValor"
							step="0.01"
							min="0"
							required
							placeholder="0.00" />
					</div>

					<!-- Forma de Pagamento -->
					<div class="form-group">
						<label for="formaPagamento">Forma de Pagamento</label>
						<select id="formaPagamento" required>
							<option value="Pix">📱 Pix</option>
							<option value="Cartão de Crédito">💳 Cartão de Crédito</option>
							<option value="Cartão de Débito">💳 Cartão de Débito</option>
							<option value="Dinheiro">💵 Dinheiro</option>
							<option value="A Prazo / Fiado">⏳ A Prazo</option>
						</select>
					</div>

					<div class="form-actions">
						<button type="submit" class="btn">📋 Registrar Pedido / O.S.</button>
					</div>
				</form>
			</div>

			<!-- Tabela de Pedidos Registrados -->
			<div class="content-card">
				<div class="content-card-title">
					<span>Histórico de Pedidos Registrados</span>
				</div>

				<div class="table-responsive">
					<table id="pedidosTable" class="tabela">
						<thead>
							<tr>
								<th>Cliente</th>
								<th>Serviços</th>
								<th>Data</th>
								<th>Valor (R$)</th>
								<th>Pagamento</th>
								<th style="text-align: center;">Ações</th>
							</tr>
						</thead>
						<tbody>
							<!-- Preenchido via JS -->
						</tbody>
					</table>
				</div>
			</div>
		</main>

		<script src="js/pedidos.js"></script>
	</body>
</html>
