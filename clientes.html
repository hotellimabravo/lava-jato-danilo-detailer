<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
		<title>Cadastro de Clientes - Lava Jato</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#0f172a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Gestão SaaS" />
		<script type="module" src="js/auth-service.js"></script>
	</head>
	<body>
		<!-- Header -->
		<header class="site-header">
			<div class="header-inner">
				<a href="index.html" class="brand-wrapper">
					<div class="brand-logo">🛠️</div>
					<div class="brand-title">
						<span>OUTRO SEGMENTO</span>
						<span class="brand-subtitle">SEU NEGÓCIO</span>
					</div>
				</a>
				<nav class="navbar">
					<a href="index.html">🏠 <span class="nav-text">Início</span></a>
					<a href="agendamentos.html">📅 <span class="nav-text">Agenda</span></a>
					<a href="pedidos.html">📋 <span class="nav-text">O.S.</span></a>
					<a href="caixa.html">💰 <span class="nav-text">Caixa</span></a>
					<a href="estoque.html">📦 <span class="nav-text">Estoque</span></a>
					<a href="fidelidade.html">🎁 <span class="nav-text">Pós-Venda</span></a>
					<a href="clientes.html" class="active">👤 <span class="nav-text">Clientes</span></a>
					<a href="servicos.html">🛠️ <span class="nav-text">Serviços</span></a>
				</nav>
				<div class="header-actions">
					<a href="configuracoes.html" class="btn-settings-gear" title="Configurações e Banco de Dados" id="btnConfiguracoes">
						⚙️
					</a>
					<button type="button" class="btn-settings-gear" title="Bloquear Sistema (Sair)" onclick="AuthService.logout()" style="background: transparent; border: none; cursor: pointer; color: inherit;">
						🔒
					</button>
				</div>
			</div>
		</header>

		<!-- Main -->
		<main class="container">
			<div class="page-header">
				<h1 class="page-title">Cadastro de Clientes</h1>
				<p class="page-subtitle">Gerencie os dados de contato e histórico dos clientes</p>
			</div>

			<!-- Formulário de Cadastro / Edição -->
			<div class="content-card">
				<div class="content-card-title">
					<span id="formCardTitle">Novo Cliente</span>
					<button type="button" id="btnCancelarEdicao" class="btn btn-secondary btn-sm" style="display: none;">Cancelar Edição</button>
				</div>
				<form id="clienteForm" class="form">
					<div class="form-group">
						<label for="clienteNome">Nome Completo *</label>
						<input
							type="text"
							id="clienteNome"
							required
							placeholder="Ex: João da Silva" />
					</div>

					<div class="form-group">
						<label for="telefone1">Telefone / WhatsApp (Código do Cliente) *</label>
						<input
							type="tel"
							id="telefone1"
							required
							placeholder="(00) 00000-0000" />
						<label class="checkbox-label">
							<input type="checkbox" id="whatsapp1" checked /> Possui WhatsApp
						</label>
					</div>

					<div class="form-group">
						<label for="telefone2">Telefone Secundário / Recado</label>
						<input
							type="tel"
							id="telefone2"
							placeholder="(00) 00000-0000 (opcional)" />
						<label class="checkbox-label">
							<input type="checkbox" id="whatsapp2" /> Possui WhatsApp
						</label>
					</div>

					<div class="form-group full-width">
						<label for="endereco">Endereço Completo</label>
						<input
							type="text"
							id="endereco"
							placeholder="Rua, número, bairro, cidade (opcional)" />
					</div>

					<div class="form-actions">
						<button type="submit" id="btnSalvarCliente" class="btn">💾 Salvar Cliente</button>
					</div>
				</form>
			</div>

			<!-- Lista de Clientes -->
			<div class="content-card">
				<div class="content-card-title">
					<span>Clientes Cadastrados</span>
				</div>

				<div class="table-responsive">
					<table id="clientesTable" class="tabela">
						<thead>
							<tr>
								<th>Nome</th>
								<th>Telefone (Código ID)</th>
								<th>Telefone Secundário</th>
								<th>Endereço</th>
								<th style="text-align: center;">Histórico</th>
								<th style="text-align: center;">Ações</th>
							</tr>
						</thead>
						<tbody>
							<!-- Preenchido via JS -->
						</tbody>
					</table>
				</div>
			</div>
		</main>

		<script src="js/brand-service.js"></script>
		<script src="js/caixa-service.js"></script>
		<script src="js/clientes.js"></script>
	</body>
</html>
